<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>つぶやきネタ帳</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('neta')" id="tab-neta">💡 ネタ出し</button>
    <button class="tab" onclick="switchTab('reply')" id="tab-reply">💬 リプライ</button>
    <button class="tab" onclick="switchTab('analysis')" id="tab-analysis">🔎 文章分析</button>
    <button class="tab" onclick="switchTab('creator')" id="tab-creator">✍️ 投稿作成</button>
    <button class="tab" onclick="switchTab('schedule')" id="tab-schedule">📅 スケジュール <span id="schedCount"></span></button>
  </div>

  <!-- ネタ出しタブ -->
  <div id="pane-neta">
    <div class="card">
      <div class="card-label">ジャンル（任意）</div>
      <div class="chips" id="genres"></div>
    </div>
    <div class="card">
      <div class="card-label">今日の気分・出来事（任意）</div>
      <textarea id="mood" rows="3" placeholder="例:「最近疲れ気味」「子どもに言われた一言が刺さった」「久しぶりに料理した」など、なんでもOK"></textarea>
    </div>
    <button class="gen-btn" id="netaBtn" onclick="generateNeta()">ネタ候補を出す</button>
    <div class="loading-note" id="loadingNote">ネタを考えています<span class="spinner">…</span></div>
    <div id="errorBox" class="error" style="display:none;"></div>

    <div class="neta-list" id="netaList"></div>

    <div class="post-area" id="postArea">
      <div class="post-area-label">▼ 投稿文（タップして選んだネタから生成）</div>
      <div class="post-box" id="postBox"></div>
      <button class="regen-btn" id="regenBtn" onclick="regenPost()">このネタで書き直す ↻</button>
    </div>
  </div>

  <!-- リプライタブ -->
  <div id="pane-reply" style="display:none;">
    <div class="card">
      <div class="card-label">バズ投稿の本文を貼り付ける</div>
      <textarea id="buzzPost" rows="4" placeholder="例:「朝5時起きを3ヶ月続けた結果...」など、絡みたい投稿をそのまま貼り付けてください"></textarea>
    </div>
    <div class="card">
      <div class="card-label">リプライの方向性</div>
      <div class="chips" id="replyTypes"></div>
    </div>
    <button class="gen-btn" id="replyBtn" onclick="generateReply()">リプライ案を生成する</button>
    <div class="loading-note" id="replyLoadingNote">生成中<span class="spinner">…</span></div>
    <div id="replyErrorBox" class="error" style="display:none;"></div>
    <div id="replyList" style="margin-top:18px;"></div>
  </div>

  <!-- スケジュールタブ -->
  <div id="pane-schedule" style="display:none;">
    <div id="schedContent"></div>
  </div>

  <!-- 文章分析タブ -->
  <div id="pane-analysis" style="display:none;">
    <div class="card">
      <div class="card-label">分析プロフィール名</div>
      <input id="analysisProfileName" class="text-input" value="職場の本音・共感型" placeholder="例: 職場の本音・共感型">
    </div>
    <div class="card">
      <div class="card-label">参考投稿（1行1投稿 / 5〜100件）</div>
      <textarea id="analysisText" rows="8" placeholder="参考にしたい投稿を1行に1件ずつ貼り付けてください。元の文章や人物をコピーせず、構造だけを分析します。"></textarea>
    </div>
    <div class="card">
      <div class="card-label">CSVアップロード（text,likes,reposts,replies,views,posted_at）</div>
      <input id="analysisCsv" type="file" accept=".csv,text/csv">
    </div>
    <button class="gen-btn" id="analysisBtn" onclick="runAnalysis()">分析プロフィールを作る</button>
    <div class="loading-note" id="analysisLoading">分析中<span class="spinner">…</span></div>
    <div id="analysisError" class="error" style="display:none;"></div>
    <div class="card safe-note">参考文の反応されやすい構造だけを利用し、元の文章や人物を再現しないよう確認しています。</div>
    <div id="analysisResult"></div>
    <div class="card">
      <div class="card-label">保存済み分析プロフィール</div>
      <div id="profileList" class="profile-list"></div>
    </div>
  </div>

  <!-- 投稿作成タブ -->
  <div id="pane-creator" style="display:none;">
    <div class="card">
      <div class="card-label">分析プロフィール</div>
      <select id="creatorProfile" class="text-input"></select>
    </div>
    <div class="card two-col">
      <label>今日あった出来事<textarea id="creatorEvent" rows="3"></textarea></label>
      <label>本当に言いたいこと<textarea id="creatorOpinion" rows="3"></textarea></label>
      <label>対象読者<input id="creatorAudience" class="text-input" placeholder="例: 会社員、APEX勢、競馬好き"></label>
      <label>テーマ<input id="creatorTheme" class="text-input" placeholder="例: 仕事、APEX、競馬"></label>
      <label>含めたい具体的な場面<textarea id="creatorScene" rows="2"></textarea></label>
      <label>含めたくないこと<textarea id="creatorAvoid" rows="2"></textarea></label>
      <label>文の強さ<select id="creatorStrength" class="text-input"><option>標準</option><option>やわらかい</option><option>強め</option></select></label>
      <label>投稿型<select id="creatorPattern" class="text-input"><option>共感</option><option>断定</option><option>問いかけ</option><option>対比</option><option>失敗談</option><option>箇条書き</option><option>ランキング</option></select></label>
      <label>文字数<select id="creatorLength" class="text-input"><option>100字前後</option><option>50字前後</option><option>140字以内</option><option>280字以内</option></select></label>
    </div>
    <button class="gen-btn" id="creatorBtn" onclick="generateOriginalPosts()">10案生成</button>
    <div class="loading-note" id="creatorLoading">生成中<span class="spinner">…</span></div>
    <div id="creatorError" class="error" style="display:none;"></div>
    <div id="generatedPosts" class="generated-list"></div>
  </div>
</div>

<script src="assets/security.js"></script>
<script src="assets/storage.js"></script>
<script src="assets/similarity.js"></script>
<script src="assets/post-scorer.js"></script>
<script src="assets/api.js"></script>
<script src="assets/analyzer.js"></script>
<script src="assets/post-generator.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
